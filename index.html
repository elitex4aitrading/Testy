<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMP X 4v - Sign Up</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            padding: 16px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Canvas Background */
        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.45;
        }

        /* Signup Box */
        .auth-container {
            width: 100%;
            max-width: 380px;
            background: rgba(10, 16, 28, 0.88);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.12), inset 0 0 15px rgba(0, 255, 136, 0.05);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, #00ff88, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            background: #ffffff;
            color: #0d1322;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .google-btn:active {
            transform: scale(0.97);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            margin: 18px 0;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        /* Form Inputs */
        .input-field {
            margin-bottom: 14px;
            position: relative;
        }

        .input-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: #00ff88;
            font-size: 13px;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff88, #00d2ff);
            color: #050811;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
            transition: all 0.3s ease;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        /* Redirect Link */
        .redirect-box {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
        }

        .redirect-box a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 800;
            margin-left: 4px;
        }

        .home-link {
            display: inline-block;
            margin-top: 15px;
            color: #64748b;
            font-size: 11px;
            text-decoration: none;
            font-weight: 700;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Upper Candlestick + Lower Wave Canvas -->
    <canvas id="trading-bg"></canvas>

    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <h1 class="auth-title">CREATE ACCOUNT</h1>
            <p class="auth-subtitle">Join MMP X 4v AI Trading Platform</p>
        </div>

        <!-- Google Register Button -->
        <button class="google-btn" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Sign up with Google
        </button>

        <div class="divider">OR REGISTER WITH EMAIL</div>

        <!-- Signup Form -->
        <form id="signup-form">
            <div class="input-field">
                <label>EMAIL ADDRESS</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="input-field">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">REGISTER NOW</button>
        </form>

        <div class="redirect-box">
            Already have an account? <a href="login.html">Login Here</a>
        </div>
    </div>

    <a href="index.html" class="home-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <!-- Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('trading-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let candles = [];
        const candleWidth = 7;
        const candleGap = 12;

        function initCandles() {
            candles = [];
            let currentY = canvas.height * 0.15;
            const totalCandles = Math.floor(canvas.width / (candleWidth + candleGap)) + 2;

            for (let i = 0; i < totalCandles; i++) {
                let change = (Math.random() - 0.48) * 20;
                let open = currentY;
                let close = open + change;
                let high = Math.min(open, close) - Math.random() * 10;
                let low = Math.max(open, close) + Math.random() * 10;
                candles.push({ x: i * (candleWidth + candleGap), open, close, high, low });
                currentY = close;
            }
        }
        initCandles();

        let waveOffset = 0;

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tech Grid Background
            ctx.strokeStyle = "rgba(0, 255, 136, 0.03)";
            ctx.lineWidth = 1;
            for(let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Upper Candlesticks
            candles.forEach((c) => {
                const isGreen = c.close < c.open;
                const color = isGreen ? '#00ff88' : '#ff0055';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(c.x + candleWidth / 2, c.high);
                ctx.lineTo(c.x + candleWidth / 2, c.low);
                ctx.stroke();

                ctx.fillStyle = color;
                let bodyHeight = Math.abs(c.close - c.open);
                if (bodyHeight < 2) bodyHeight = 2;
                ctx.fillRect(c.x, Math.min(c.open, c.close), candleWidth, bodyHeight);
            });

            candles.forEach(c => c.x -= 0.6);
            if (candles[0] && candles[0].x < -candleWidth) {
                candles.shift();
                let lastCandle = candles[candles.length - 1];
                let change = (Math.random() - 0.48) * 20;
                let open = lastCandle.close;
                let close = open + change;
                if (close < canvas.height * 0.05) close = canvas.height * 0.12;
                if (close > canvas.height * 0.28) close = canvas.height * 0.20;
                let high = Math.min(open, close) - Math.random() * 8;
                let low = Math.max(open, close) + Math.random() * 8;
                candles.push({ x: lastCandle.x + candleWidth + candleGap, open, close, high, low });
            }

            // Lower Wave Area
            waveOffset += 0.02;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            const baseHeight = canvas.height * 0.82;
            const amplitude = 22;

            for (let x = 0; x <= canvas.width; x += 10) {
                let y = baseHeight + Math.sin(x * 0.008 + waveOffset) * amplitude + Math.cos(x * 0.015 + waveOffset * 0.8) * (amplitude * 0.5);
                ctx.lineTo(x, y);
            }

            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();

            const gradient = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
            gradient.addColorStop(0, "rgba(0, 210, 255, 0.28)");
            gradient.addColorStop(1, "rgba(0, 255, 136, 0.01)");
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(drawBackground);
        }
        drawBackground();
    </script>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->

</body>
